name: Build and deploy to Hostinger

# Three triggers:
#   push      — ship changes as soon as they land on main
#   schedule  — the daily rebuild that refreshes the market news feed
#   manual    — "Run workflow" button in the Actions tab
#
# The site is a static export, so nothing Node-related runs on Hostinger.
# GitHub builds it; Hostinger only serves the files. That means this works on
# every Hostinger plan, including the cheapest shared one.
on:
  push:
    branches: [main]
  schedule:
    # 01:30 UTC = 07:00 IST, before the Indian market opens.
    - cron: '30 1 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fetches the latest market headlines, builds the static export into
      # ./out, then writes .htaccess / _headers / _redirects alongside it.
      - name: Build
        run: npm run build

      - name: Verify the build looks sane
        run: |
          test -f out/index.html            || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/.htaccess             || { echo "::error::out/.htaccess missing"; exit 1; }
          test -f out/sitemap.xml           || { echo "::error::out/sitemap.xml missing"; exit 1; }
          test -f out/404.html              || { echo "::error::out/404.html missing"; exit 1; }
          echo "pages built: $(find out -name index.html | wc -l)"

      - name: Deploy to Hostinger over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: /public_html/
          # Incremental: only changed files are uploaded, tracked by a state
          # file on the server. Flip to true once if you need a clean wipe.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
