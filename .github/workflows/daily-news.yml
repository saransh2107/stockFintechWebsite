name: Daily news rebuild

# The site is statically generated, so fresh market headlines need a rebuild.
# This pings a Cloudflare Pages deploy hook, which re-runs `npm run build` and
# therefore re-fetches the RSS feeds.
#
# Setup:
#   1. Cloudflare Pages project > Settings > Builds & deployments > Deploy hooks
#      Create one on branch `main`, copy the URL.
#   2. GitHub repo > Settings > Secrets and variables > Actions
#      Add it as CF_DEPLOY_HOOK.
on:
  schedule:
    - cron: '30 1 * * *' # 01:30 UTC = 07:00 IST, before market open
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages rebuild
        run: |
          if [ -z "${{ secrets.CF_DEPLOY_HOOK }}" ]; then
            echo "::warning::CF_DEPLOY_HOOK is not set — skipping. See the comment at the top of this file."
            exit 0
          fi
          curl -fsSL -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
          echo "rebuild triggered"
