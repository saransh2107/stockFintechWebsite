    <path d="M38,196 L68,178 L98,180 L128,161 L158,145 L188,150 L218,130 L248,113 L278,118 L308,99 L338,80 L338,250 L38,250 Z" fill="url(#area)"/>
    <path d="M38,196 L68,178 L98,180 L128,161 L158,145 L188,150 L218,130 L248,113 L278,118 L308,99 L338,80" fill="none" stroke="url(#mint)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="338" cy="80" r="6.5" fill="#00E39A"/>
