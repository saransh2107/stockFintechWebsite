<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="100%" stop-color="#0C1526"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38D6FF"/>
      <stop offset="100%" stop-color="#00E39A"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E39A"/>
      <stop offset="100%" stop-color="#38D6FF"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E39A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00E39A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#00E39A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00E39A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark -->
  <rect x="80" y="74" width="60" height="60" rx="16" fill="url(#badge)"/>
  <g fill="none" stroke="#05070D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M93 118 L104 104 L113 111 L128 92"/>
    <path d="M118 92 H128 V102"/>
