    <text x="86" y="35" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#8FA0B8">LIVE · NIFTY 50</text>

    <text x="28" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#EEF3FA">24,836.30</text>
    <text x="250" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#00E39A">▲ 0.84%</text>

