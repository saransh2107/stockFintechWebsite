  <text x="158" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#EEF3FA">Stock Fintech</text>
  <text x="158" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#8FA0B8">LEARN · GROW · SHINE</text>

  <!-- Headline -->
  <text x="80" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#EEF3FA">Master the markets.</text>
  <text x="80" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#mint)">Learn, trade &amp; invest.</text>

  <text x="80" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#8FA0B8">Stock market · NISM certification · Forex &amp; Crypto</text>
  <text x="80" y="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#8FA0B8">Classroom in Lucknow &amp; live online · English &amp; Hindi</text>

  <!-- Stat chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="80" y="478" width="190" height="72" rx="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <text x="100" y="510" font-size="28" font-weight="800" fill="#00E39A">10,000+</text>
    <text x="100" y="534" font-size="14" fill="#8FA0B8">Students trained</text>

    <rect x="290" y="478" width="170" height="72" rx="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.09"/>
