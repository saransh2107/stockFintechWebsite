    <text x="310" y="534" font-size="14" fill="#8FA0B8">Average rating</text>

    <rect x="480" y="478" width="170" height="72" rx="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <text x="500" y="510" font-size="28" font-weight="800" fill="#FFB547">92%</text>
    <text x="500" y="534" font-size="14" fill="#8FA0B8">NISM pass rate</text>
