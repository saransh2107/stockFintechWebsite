  <!-- Footer strip -->
  <rect x="0" y="588" width="1200" height="42" fill="#0A101C"/>
  <text x="80" y="615" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8FA0B8">mystockfintech.com</text>
  <text x="1120" y="615" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8FA0B8">Ashiyana, Lucknow</text>
