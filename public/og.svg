    <g>
      <rect x="30" y="185" width="16" height="22" rx="3" fill="#FF4D6A" fill-opacity="0.8"/>
      <rect x="30" y="178" width="16" height="36" rx="2" fill="#FF4D6A" fill-opacity="0.25"/>
      <rect x="60" y="168" width="16" height="20" rx="3" fill="#00E39A" fill-opacity="0.9"/>
      <rect x="90" y="172" width="16" height="16" rx="3" fill="#FF4D6A" fill-opacity="0.8"/>
      <rect x="120" y="148" width="16" height="26" rx="3" fill="#00E39A" fill-opacity="0.9"/>
      <rect x="150" y="136" width="16" height="18" rx="3" fill="#00E39A" fill-opacity="0.9"/>
      <rect x="180" y="142" width="16" height="16" rx="3" fill="#FF4D6A" fill-opacity="0.8"/>
      <rect x="210" y="116" width="16" height="28" rx="3" fill="#00E39A" fill-opacity="0.9"/>
      <rect x="240" y="104" width="16" height="18" rx="3" fill="#00E39A" fill-opacity="0.9"/>
      <rect x="270" y="110" width="16" height="16" rx="3" fill="#FF4D6A" fill-opacity="0.8"/>
      <rect x="300" y="84" width="16" height="30" rx="3" fill="#00E39A" fill-opacity="0.9"/>
      <rect x="330" y="70" width="16" height="20" rx="3" fill="#00E39A" fill-opacity="0.95"/>
